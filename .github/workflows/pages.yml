# Publica la versión web (carpeta app/) en GitHub Pages en cada push a main.
name: Publicar NEONVERSE web
# Solo manual: el sitio se publica con «Deploy from a branch» (main, raíz). Úsalo si cambias Pages a «GitHub Actions».
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-web.mjs   # app/vendor va en el repositorio: no hace falta npm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-web }
      - id: deployment
        uses: actions/deploy-pages@v4
